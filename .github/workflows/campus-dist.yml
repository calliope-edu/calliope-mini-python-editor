name: campus-dist

# Builds the editor for Calliope Campus, which serves it itself under
# /editors/python/ on its own origin (calliope-campus docs/editors.md), and
# pushes the build to the `campus-dist` branch: one commit per build of
# `tested-bootloader`, the build output at its root plus CAMPUS-BUILD.json
# naming the source commit. Campus pins a commit of that branch as its
# editors/python submodule and moves the pin by hand ("bump python editor"),
# so nothing built here reaches campus.calliope.cc unreviewed.
#
# The branch only ever grows: Campus release tags pin its older commits, so
# rewriting it would break their builds.

on:
  push:
    branches:
      - tested-bootloader
  workflow_dispatch:

# One build after the other, so every push lands on the branch in order.
concurrency:
  group: campus-dist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips puppeteer's Chromium download and the native usb
      # module, which the build does not need; patch-package is the one install
      # script it does need.
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx patch-package

      - run: npx craco build
        env:
          # Every asset and the pyright workers are prefixed with this path.
          PUBLIC_URL: /editors/python
          # CI=true would turn lint warnings into build errors.
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Push the build to campus-dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short=${SOURCE_SHA:0:7}
          mkdir dist && cd dist
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin campus-dist; then
            git checkout -q -b campus-dist FETCH_HEAD
          else
            git checkout -q --orphan campus-dist
          fi
          git rm -rqf --ignore-unmatch .
          cp -r ../build/. .
          printf '{\n  "source": "%s",\n  "branch": "%s",\n  "base": "/editors/python/",\n  "built": "%s"\n}\n' \
            "$SOURCE_SHA" "$SOURCE_REF" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > CAMPUS-BUILD.json
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "build ${short} from ${SOURCE_REF}" -m "Source: https://github.com/${REPO}/commit/${SOURCE_SHA}"
          git push -q origin campus-dist
          echo "### campus-dist: build ${short} from ${SOURCE_REF}" >> "$GITHUB_STEP_SUMMARY"
